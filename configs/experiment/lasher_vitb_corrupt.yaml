# Robustness experiment: CodeTrack trained and evaluated under the corruption protocol.
#
# Token-level corruption is the setting the four-term objective is built for:
#   L = L_track + 1.0 * L_detect + 2.0 * L_correct + 0.1 * L_identity
_base_: ../experiment/lasher_vitb.yaml

corruption:
  enabled: true
  level: mixed
  # image-level degradation as well: without it the backbone taps stay perfectly clean
  # and the FPN path becomes a shortcut that bypasses the whole correction branch
  rgb: [rgb_lowlight, rgb_occl]
  tir: [tir_crossover, tir_noise]
  # Burst erasure is the corruption the Tanner prior can actually use: it is spatially
  # coherent, so a locality-aligned H turns it into a check-level pattern (per-check
  # density contrast 0.31 -> 1.30, syndrome pearson 0.007 -> 0.978).  Under independent
  # random erasure the same prior buys nothing (contrast stays ~0.29) and the syndrome
  # carries no information at all.  Both settings are reported in the paper; random
  # erasure is the negative control that shows the prior is doing the work.
  token: [tok_burst_erase]
  ratio: 0.2
  severity: 0.4
  target: both
  both_modalities: true
