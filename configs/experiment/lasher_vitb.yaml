# Main experiment: CodeTrack ViT-B/16 on LasHeR (train split only).
_base_: ../default.yaml

data:
  dataset: lasher
  root: /root/autodl-tmp/lab/dataset/LasHeR
  batch_size: 8
  num_workers: 4
  samples_per_epoch: 131072

train:
  epochs: 10
  lr: 0.0001
  batch_size: 8

eval:
  metrics: [pr, sr, npr]
