# CodeTrack base configuration. Experiment configs inherit from this file via `_base_`.
seed: 0
device: cuda

model:
  name: codetrack
  backbone: vitb_shared
  # OSTrack ViT-B/16 checkpoint; initialises the shared backbone AND the tracking head
  pretrained: checkpoints/pretrained/OSTrack_ep0300.pth.tar
  img_size: 256
  template_size: 128
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  return_stages: [2, 5]
  freeze_backbone: true
  tir_from_rgb: true
  # ---- CodeTrack blocks (architecture figure) ----
  code_dim: 256          # ECC projection output width
  check_dim: 128         # check-node embedding width
  num_identity_tokens: 16
  num_parity_tokens: 16
  parity_links: 4        # ones per row of the sparse parity matrix A
  num_variable_nodes: 256
  num_graph_nodes: 128
  graph_top_k: 8
  bp_iterations: 2
  # "bp" = neural Tanner / BP-style message passing; "mlp" = parameter-matched residual
  # denoiser with no message passing (the ablation that decides whether Tanner earns
  # its keep).  NOTE: the messages are aggregated per node over the whole H, i.e. there
  # is no per-edge extrinsic exclusion -- the paper must call this BP-*style*.
  decoder_mode: bp
  # Hidden width of the "mlp" arm.  0 solves it from the BP message-function parameter count
  # (the parameter-matched baseline); a positive value pins it, which is how a checkpoint
  # trained with an earlier auto formula can still be rebuilt (outputs/ab_mlp_corr used 2048).
  mlp_hidden: 0
  # Output parameterisation of the decoder.
  #   post_norm        : shipped behaviour -- update in raw token space, output LayerNorm.
  #                      L_correct compares that output against pre-norm clean features, and
  #                      tools/step_size_probe.py shows the update overshooting the ideal step
  #                      by 2-10x while the LayerNorm absorbs the scale.
  #   identity_residual: LayerNorm moves inside the update branch, the output is the raw
  #                      residual sum, and a zero-initialised projection makes the model start
  #                      at the identity.  No output LayerNorm exists in this mode, so the
  #                      four-cell probe degenerates to two cells by construction.
  decoder_output: post_norm
  # L2 budget for one residual step (0 = unbounded).  Set it from
  #   python tools/calibrate_residual_budget.py --quantile 0.99
  # which takes a fixed high quantile of the IDEAL residual x* - x on a calibration split; on
  # the 60-sequence development split that was 19.05 for RGB token block erasure at ratio 0.2.
  residual_clip: 0.0
  # Force the severity gate to 1, leaving only the (1 - r) reliability factor.  Measured: the
  # learned gate is near zero on most damaged tokens and permuting its values within
  # (reliability, ||d||) strata changes nothing, so the four-arm grid tests whether it earns
  # its place at all.
  gate_always_one: false
  # Which state the decoder rounds read.
  #   recurrent (default) -- round l reads the state round l-1 produced.  This is standard
  #                          message passing and is the behaviour of every checkpoint trained
  #                          before commit 073c223.
  #   held               -- every round reads the decoder's *input*, so the rounds accumulate
  #                          independent updates computed from the same word instead of
  #                          composing.  073c223 introduced this silently for the
  #                          post_norm/mlp/spatial paths; the P2 arms A and B were trained
  #                          under it, so reproducing them needs
  #                          --override model.decoder_state_mode=held.
  # The two differ only when bp_iterations > 1.  See tools/decoder_state_equivalence.py and
  # docs/results.md 6.27 for the measured difference.
  decoder_state_mode: recurrent
  h_links_per_check: 24
  # Optional degree-matched support construction for geometry ablations. Off preserves the
  # reference support sampler; on keeps every check row at h_links_per_check and balances
  # variable-node degrees by edge swaps.
  h_balance_degrees: false
  # Locality prior on H's support.  0 = uniform random (off).  With a window of W cells on
  # the 16x16 grid each check may only LEARN edges inside its own window, plus a
  # free_edge_frac share of unrestricted edges so it can still reach across the frame.
  # Rationale: with a uniform random support a spatially contiguous burst is still just an
  # arbitrary fixed-size set to every check, so the burst's spatial continuity is washed out
  # before it reaches check-space.  The edges stay learned (softplus(H) inside the window);
  # only the candidate set is restricted, so the claim is "learned sparse H under a
  # geometric prior", not a hand-designed neighbourhood.
  # A value of 5 selects a 5x5 candidate window on the 16x16 search grid. Use
  # tools/locality_geometry.py to measure realized support degrees and density contrast for
  # the current configuration; random erasure is a control and is not assumed uninformative.
  h_locality_window: 5
  h_free_edge_frac: 0.25
  # "learned" = softplus(H) weights on the fixed support; "uniform" freezes them at plain
  # 1/degree averaging.  The pair isolates geometry from learning: uniform+local is pure
  # geometry, learned+local adds the learned weights on top.
  h_weight_init: learned
  h_locality_wrap: true
  # bounded learnable assignment temperature for the parity mixture
  # tau = tau_min + (tau_max - tau_min) * sigmoid(rho); init reproduces 0.1
  assign_temperature: 0.1
  tau_min: 0.02
  tau_max: 0.5
  fpn_dim: 256
  # FPN taps come from before token corruption, so they are masked with the *same*
  # corruption mask (see CodeTrack._apply_tap_corruption): a clean bypass would let
  # L_track ignore the correction branch entirely.
  use_fpn: true
  # The per-check observation energy is a label proxy under zero-erasure (corr 1.000 with
  # the corruption density), so the syndrome head does NOT see it by default.  Any result
  # claiming the Tanner structure produced the syndrome must be measured with this false.
  syndrome_use_obs_energy: false
  head_type: CENTER
  head_channel: 256
  discrepancy: learned
  dropout: 0.0

data:
  dataset: lasher
  root: /root/autodl-tmp/lab/dataset/LasHeR
  template_size: 128
  search_size: 256
  num_workers: 4
  batch_size: 8
  samples_per_epoch: 131072
  search_factor: 4.0
  template_factor: 2.0

corruption:
  enabled: false
  level: mixed
  rgb: []
  tir: []
  # token-level corruption is what L_detect / L_correct are trained against
  token: [tok_random_erase]
  ratio: 0.2
  severity: 0.4
  # which modality gets the token corruption: both | rgb | tir
  target: both
  cross_modal: false
  probability: 1.0
  both_modalities: true

train:
  epochs: 10
  samples_per_epoch: 131072
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  log_every: 10
  # stage 1: train codebook + BP decoder only for N epochs, then joint fine-tuning
  codec_warmup_epochs: 1
  # every N steps, report cos(L_track, L_correct) on the shared blocks (0 = off)
  grad_diag_every: 0

loss:
  # L = L_track + 1.0 * L_detect + 2.0 * L_correct + 0.1 * L_identity
  cls: 1.0
  l1: 5.0
  giou: 2.0
  lambda_detect: 1.0
  lambda_correct: 2.0
  lambda_identity: 0.1
  # sub-terms of L_correct (already inside lambda_correct's budget, not a 5th loss):
  #   preserve -- the decoder must leave healthy tokens alone
  #   gain     -- the result must beat the corrupted input by a margin, so that
  #               "change nothing" is not a local optimum
  lambda_preserve: 0.5
  # Keep L_gain configurable. Check its effect with the shared masked_recovery
  # implementation on held-out inputs before changing its weight.
  lambda_gain: 0.0
  gain_beta: 0.9
  # Sub-weights of L_detect. Exposed separately so each supervision path can be ablated
  # without changing the other loss terms.
  detect_reliability: 1.0
  detect_syndrome: 1.0
  detect_localize: 1.0
  clean_teacher: true

eval:
  metrics: [pr, sr, npr]
