[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codetrack"
version = "0.1.0"
description = "Structured Redundancy and Syndrome-Guided Correction for Robust RGB-T Tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TODO" }]
keywords = ["rgb-t tracking", "single object tracking", "error correction", "ldpc", "tanner graph"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "einops>=0.7",
  "scipy>=1.11",
  "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "pre-commit>=3.6",
]

[project.scripts]
codetrack-train = "codetrack.cli.train:main"
codetrack-eval = "codetrack.cli.eval:main"
codetrack-demo = "codetrack.cli.demo:main"
codetrack-export = "codetrack.cli.export:main"

[project.urls]
Homepage = "TODO"
Paper = "TODO"

[tool.setuptools.packages.find]
include = ["codetrack*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["codetrack"]
